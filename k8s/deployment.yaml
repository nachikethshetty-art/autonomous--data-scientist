apiVersion: v1
kind: Namespace
metadata:
  name: ai-data-scientist
  labels:
    name: ai-data-scientist

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-config
  namespace: ai-data-scientist
data:
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "production"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"

---
apiVersion: v1
kind: Secret
metadata:
  name: ai-secrets
  namespace: ai-data-scientist
type: Opaque
stringData:
  slack_webhook_url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
  email_smtp_password: "your-password"
  database_url: "sqlite:///data/jobs.db"

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ai-data-pv
  namespace: ai-data-scientist
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/mnt/data/ai-data-scientist"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-data-pvc
  namespace: ai-data-scientist
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  volumeName: ai-data-pv

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-api-server
  namespace: ai-data-scientist
  labels:
    app: ai-api-server
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ai-api-server
  template:
    metadata:
      labels:
        app: ai-api-server
        version: v1
    spec:
      containers:
      - name: api
        image: ai-data-scientist:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: ai-config
        - secretRef:
            name: ai-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ai-data-pvc
      - name: logs
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: ai-api-service
  namespace: ai-data-scientist
  labels:
    app: ai-api-server
spec:
  type: LoadBalancer
  selector:
    app: ai-api-server
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-api-hpa
  namespace: ai-data-scientist
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-api-server
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-serviceaccount
  namespace: ai-data-scientist

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-role
  namespace: ai-data-scientist
rules:
- apiGroups: [""]
  resources: ["pods", "pods/logs"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-rolebinding
  namespace: ai-data-scientist
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-role
subjects:
- kind: ServiceAccount
  name: ai-serviceaccount
  namespace: ai-data-scientist

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-pdb
  namespace: ai-data-scientist
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-api-server
