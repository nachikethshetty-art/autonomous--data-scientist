services:
  - type: web
    name: autonomous-ai-api
    env: python
    pythonVersion: 3.11.8
    buildCommand: pip install --upgrade setuptools wheel && pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
