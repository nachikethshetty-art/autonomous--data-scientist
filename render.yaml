services:
  - type: web
    name: autonomous-ai-api
    env: python
    pythonVersion: 3.11
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
    buildCommand: pip install --upgrade pip setuptools wheel && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
