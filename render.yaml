services:
  - type: web
    name: autonomous-ai-api
    env: python
    pythonVersion: 3.11.8
    buildCommand: python3.11 -m pip install --upgrade pip setuptools wheel && python3.11 -m pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
