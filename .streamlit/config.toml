[theme]
primaryColor = "#FF6B6B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[server]
headless = true
port = 8501
runOnSave = true
maxUploadSize = 200
enableXsrfProtection = true
enableCORS = false

[logger]
level = "info"

[client]
showErrorDetails = true
toolbarMode = "minimal"

[cache]
maxEntries = 1000

[deprecation]
showPyplotGlobalUse = false
